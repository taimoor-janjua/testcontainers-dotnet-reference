name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test --project tests/Sample.UnitTests --report-xunit-trx --results-directory ${{ github.workspace }}/TestResults/unit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-results
          path: TestResults/

  integration:
    runs-on: ubuntu-latest
    needs: unit
    env:
      # The image is built in its own step, so the tests should not rebuild it.
      BUILD_FUNCTION_IMAGE: never
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build function image
        run: ./scripts/build-function-image.sh sample-functions:test
      - run: dotnet test --project tests/Sample.IntegrationTests --report-xunit-trx --results-directory ${{ github.workspace }}/TestResults/integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results
          path: TestResults/
